[workspace]
members = ["core", "storage", "sync", "ffi", "kotlin_ffi"]
resolver = "3"

[workspace.package]
version = "0.7.0"
edition = "2024"

[workspace.dependencies]
pyo3 = { version = "0.28.3", features = ["extension-module"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
criterion = "0.7.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
csv = "1.4.0"
calamine = "0.31"
rust_xlsxwriter = "0.92"
printpdf = { version = "0.12.8", default-features = false }
uniffi = "0.29.4"
libc = "0.2.186"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_SystemInformation"] }
ledgera_engine_core = { path = "core" }
ledgera_engine_storage = { path = "storage" }
ledgera_engine_sync = { path = "sync" }
